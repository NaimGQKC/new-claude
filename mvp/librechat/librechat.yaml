version: 1.3.0
cache: true

# Everything below is about one thing: a screen a non-technical person understands in 10 seconds.
interface:
  modelSelect: false          # nobody picks a model
  parameters: false           # no sliders or settings
  presets: false
  bookmarks: false
  multiConvo: false
  prompts: false
  agents: false
  marketplace: {use: false}
  mcpServers: {use: false, create: false, share: false, public: false}   # no technical connector screen; connectors will appear through chat
  skills: false
  runCode: false
  webSearch: false            # our own research does this, with sources
  fileSearch: false
  contextUsage: false
  landingHeading: greeting
  customWelcome: "Hola, ¿en qué te puedo ayudar hoy?"
  landingFooter: false
  mascot: false
  buildInfo: false
  temporaryChat: true         # a "chat that is not saved" option
  sharedLinks: true

# Remembers useful facts about the user between chats (cheap model, runs in the background).
memory:
  tokenLimit: 2000
  personalize: true
  agent:
    enabled: true
    provider: "LiteLLM"
    model: "fast"

endpoints:
  custom:
    - name: "Herramientas"          # front door: normal chat -> model router, files -> document maker
      apiKey: "tools"
      baseURL: "${TOOLS_BASE_URL}"
      models: {default: ["asistente", "deep-research", "crear-documento", "crear-imagen"], fetch: false}
      titleConvo: true
      titleModel: "asistente"
      customParams:
        reasoningKey: reasoning_content
    - name: "LiteLLM"               # direct line to the router for "Pensar más"
      apiKey: "${LITELLM_API_KEY}"
      baseURL: "${LITELLM_BASE_URL}"
      models: {default: ["auto", "auto-think", "fast"], fetch: false}
      titleConvo: true
      titleModel: "fast"
      customParams:
        reasoningKey: reasoning_content

modelSpecs:
  enforce: true
  prioritize: true
  list:
    - name: "asistente"
      label: "Asistente"
      description: "Pregunta lo que quieras. Elijo la mejor forma de ayudarte."
      default: true
      showOnLanding: true
      hideBadgeRow: true
      memory: true
      conversation_starters:
        - "Pega aquí un email y te preparo la respuesta: "
        - "Resume un documento que voy a adjuntar"
        - "Hazme una hoja de cálculo para controlar mis gastos del mes"
        - "Crea una imagen para una publicación de Instagram sobre: "
      preset:
        endpoint: "Herramientas"
        model: "asistente"
        modelLabel: "Asistente"
        promptPrefix: "Responde siempre en español sencillo, con frases cortas y sin jerga técnica. Sé breve: unas 3 a 6 frases, salvo que te pidan más detalle. Si hay pasos, enuméralos del 1 al 5 como máximo. Termina con una frase corta ofreciendo ayuda con el siguiente paso."
    - name: "pensar-mas"
      label: "Pensar más"
      description: "Se toma más tiempo y razona con más cuidado. Para temas difíciles."
      hideBadgeRow: true
      preset:
        endpoint: "LiteLLM"
        model: "auto-think"
        modelLabel: "Pensar más"
        promptPrefix: "Responde en español sencillo y sin jerga. Razona con cuidado y explica el resultado de forma clara y ordenada, pero sin alargarte."
    - name: "investigacion"
      label: "Investigación profunda"
      description: "Busca en internet, lee muchas páginas y te da un informe con fuentes. Tarda unos minutos."
      hideBadgeRow: true
      conversation_starters:
        - "Investiga cómo han cambiado los precios de las clínicas de fisioterapia en España"
      preset: {endpoint: "Herramientas", model: "deep-research", modelLabel: "Investigación profunda"}
