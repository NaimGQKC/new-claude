# MVP routing config. Host for now: OpenRouter (all models, one key). Use FAKE/non-sensitive data only.
# To switch host later (OVH, T-Systems, Berget...), change `model:` / `api_base` / `api_key` in each entry below.
# Model IDs were checked against openrouter.ai/api/v1/models on 2026-11-19.
#
# model_info costs = what we use to show the user their spend. They are list prices (USD per token);
# OpenRouter may charge less if it routes to a cheaper provider. Re-check before launch.
model_list:
  # --- real models -------------------------------------------------------
  - model_name: fast            # DeepSeek V4.1 Flash, thinking OFF: simple emails, rewrites, chit-chat
    litellm_params:
      model: openrouter/deepseek/deepseek-v4.1-flash-1017
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body: {reasoning: {enabled: false}}
    model_info: {input_cost_per_token: 0.0000003, output_cost_per_token: 0.0000012}
  - model_name: balanced        # DeepSeek V4.1 Flash, thinking ON: normal questions, analysis
    litellm_params:
      model: openrouter/deepseek/deepseek-v4.1-flash-1017
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body: {reasoning: {enabled: true}}
    model_info: {input_cost_per_token: 0.0000003, output_cost_per_token: 0.0000012}
  - model_name: writer          # GLM-5.3: long, polished writing
    litellm_params:
      model: openrouter/z-ai/glm-5.3
      api_key: os.environ/OPENROUTER_API_KEY
    model_info: {input_cost_per_token: 0.0000014, output_cost_per_token: 0.0000044}
  - model_name: strong          # Kimi K3.1 Pro: hardest reasoning (license still to be reviewed before selling)
    litellm_params:
      model: openrouter/moonshotai/kimi-k3.1-pro
      api_key: os.environ/OPENROUTER_API_KEY
    model_info: {input_cost_per_token: 0.000003, output_cost_per_token: 0.000015}

  # --- what the user's app sees -----------------------------------------
  - model_name: auto            # the software picks the model; the user never does
    litellm_params:
      model: auto_router/complexity_router
      complexity_router_config:
        tiers:
          SIMPLE: fast
          MEDIUM: balanced
          COMPLEX: writer
          REASONING: strong
        keyword_tier_rules:
          - keywords: ["redacta", "escribe un informe", "write a report"]
            tier: COMPLEX
          - keywords: ["analiza en profundidad", "paso a paso", "step by step"]
            tier: REASONING
        session_affinity: true            # same model for a whole chat (keeps the prompt cache warm)
        session_affinity_ttl_seconds: 3600
      complexity_router_default_model: balanced
  - model_name: auto-think      # the "Pensar más" switch: always the strongest model
    litellm_params:
      model: openrouter/moonshotai/kimi-k3.1-pro
      api_key: os.environ/OPENROUTER_API_KEY
    model_info: {input_cost_per_token: 0.000003, output_cost_per_token: 0.000015}

litellm_settings:
  drop_params: true             # ignore params a given model doesn't support
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
