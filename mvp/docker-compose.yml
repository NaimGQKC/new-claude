# MVP stack: LibreChat (chat UI) -> LiteLLM (router + cost tracking) -> EU-hosted open models.
# Images are pinned to exact tags on purpose (LiteLLM PyPI releases 1.82.7/1.82.8 were compromised
# in March 2026; we only run the official Docker image, never `pip install litellm`).
services:
  librechat:
    image: ghcr.io/danny-avila/librechat:v0.8.9
    depends_on: [mongo, litellm]
    ports: ["3080:3080"]
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/LibreChat
      LITELLM_BASE_URL: http://litellm:4000/v1
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY}
    volumes:
      - ./librechat/librechat.yaml:/app/librechat.yaml:ro
      - librechat_uploads:/app/uploads
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes: [mongo_data:/data/db]
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:v1.110.1
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@postgres:5432/litellm
    depends_on: [postgres]
    volumes: ["./litellm/config.yaml:/app/config.yaml:ro"]
    # Not published to the internet: only LibreChat talks to it.
    expose: ["4000"]
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: litellm
    volumes: [pg_data:/var/lib/postgresql/data]
    restart: unless-stopped

volumes: {librechat_uploads: {}, mongo_data: {}, pg_data: {}}
